name: Header-Only

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  api-only:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure header-only build
        run: >
          cmake -S . -B build-header
          -DLOC_BUILD_TESTS=ON
          -DLOC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-header --config Release

      - name: Test
        run: ctest --test-dir build-header --build-config Release --output-on-failure

      - name: Install smoke check
        run: cmake --install build-header --prefix "${{ github.workspace }}/stage"
