<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">loc++ logo</title>
  <desc id="desc">A minimalist logo for loc++ showing data flowing through a lightweight container</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#141d2b"/>
    </linearGradient>
    <linearGradient id="stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="320" rx="24" fill="url(#bg)"/>

  <!-- Emblem: lightweight brackets around flowing data -->
  <g transform="translate(60 60)">
    <!-- Outer thin frame - represents "low overhead container" -->
    <path d="M40 0 L0 0 L0 200 L40 200" fill="none" stroke="url(#frame)" stroke-width="6" stroke-linecap="round"/>
    <path d="M160 0 L200 0 L200 200 L160 200" fill="none" stroke="url(#frame)" stroke-width="6" stroke-linecap="round"/>

    <!-- Flowing data streams - represents media content -->
    <g opacity="0.9">
      <rect x="50" y="40" width="100" height="16" rx="8" fill="url(#stream)"/>
      <rect x="60" y="70" width="80" height="16" rx="8" fill="url(#stream)" opacity="0.8"/>
      <rect x="50" y="100" width="100" height="16" rx="8" fill="url(#stream)"/>
      <rect x="70" y="130" width="60" height="16" rx="8" fill="url(#stream)" opacity="0.8"/>
      <rect x="50" y="160" width="100" height="16" rx="8" fill="url(#stream)"/>
    </g>

    <!-- Small accent dots at corners -->
    <circle cx="0" cy="0" r="6" fill="#22d3ee"/>
    <circle cx="200" cy="0" r="6" fill="#22d3ee"/>
    <circle cx="0" cy="200" r="6" fill="#22d3ee"/>
    <circle cx="200" cy="200" r="6" fill="#22d3ee"/>
  </g>

  <!-- Text -->
  <g fill="#f8fafc" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace">
    <text x="300" y="145" font-size="96" font-weight="700" letter-spacing="-2">loc++</text>
    <text x="304" y="190" font-size="18" font-weight="500" fill="#22d3ee" letter-spacing="3">LOW OVERHEAD CONTAINER</text>
    <text x="304" y="220" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="1">Media Over QUIC Transport</text>
  </g>

</svg>
